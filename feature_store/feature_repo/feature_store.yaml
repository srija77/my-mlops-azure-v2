# Feast feature store — Azure flavour.
#
# The source project used provider: local (SQLite registry + SQLite online
# store). On Azure the same FeatureViews/FeatureService (feature_definitions.py,
# copied verbatim) are backed by cloud stores:
#   - registry:      Azure Blob (shared across CI, training, serving)
#   - offline store: the Parquet in Blob (file source) — used for training
#   - online store:  Azure Cache for Redis — low-latency lookups at serving time
#
# Requires:  pip install "feast[azure,redis]"
# Set the connection strings via env vars (never commit secrets):
#   REGISTRY_BLOB_URL  = https://<storage>.blob.core.windows.net/feast/registry.db
#   REDIS_CONN         = <redis-host>:6380,password=<key>,ssl=True
project: energy_feature_store

registry:
  registry_type: file
  # Point at a Blob URL in production; falls back to a local path for dev.
  path: ${REGISTRY_BLOB_URL:data/registry.db}
  cache_ttl_seconds: 600

provider: azure

online_store:
  type: redis
  connection_string: ${REDIS_CONN:localhost:6379}

offline_store:
  type: file

entity_key_serialization_version: 3

auth:
  type: no_auth
