name: dam-mcp-scoring
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip=24.0
  - setuptools<81   # provides pkg_resources, required by mlflow at import
  - pip:
      - azureml-inference-server-http==1.3.2
      # REQUIRED, and not pulled in automatically. The inference server's
      # _patch_azureml_contrib_services() hard-imports azureml.contrib.services
      # at boot, but azureml-inference-server-http does not declare it as a
      # dependency. Without this the container crashes on start with
      # "ModuleNotFoundError: No module named 'azureml.contrib'" and the
      # deployment fails with the generic "User container has crashed".
      #
      # It matters more here because azureml-ai-monitoring ships an
      # azureml/__init__.py with no namespace declaration, making `azureml` a
      # regular package rather than a namespace package.
      - azureml-contrib-services
      # Production data collection SDK. Supplies azureml.ai.monitoring.Collector,
      # which scoring/score.py uses to write model_inputs / model_outputs.
      # This is the runtime half of the diagram edge EP -. inference data .-> MON;
      # without it the Collector import fails and drift signals see no data.
      - azureml-ai-monitoring==1.0.0
      - mlflow==2.15.1
      - scikit-learn==1.5.2
      - xgboost==2.1.3
      - pandas==2.2.3
      - numpy==1.26.4
