# ============================================================================
# Azure ML Model Monitoring — the native replacement for the source project's
# Evidently + Prometheus/Grafana drift stack and the retrain-on-drift GitHub
# Action. Runs on a schedule, compares live endpoint inference data against the
# March 2025 training baseline, and alerts (email / Azure Monitor) on drift.
#
# Create:  az ml schedule create -f aml/monitoring.yml
#
# Requires: the endpoint deployed with data collection enabled, and a reference
# data asset `dam_mcp_reference` (see src/monitoring/create_reference_data.py).
# ============================================================================
$schema: https://azuremlschemas.azureedge.net/latest/monitorSchedule.schema.json
name: dam-mcp-drift-monitor
display_name: DAM MCP data drift monitor
trigger:
  type: recurrence
  frequency: day
  interval: 1
  schedule:
    hours: [3]
    minutes: [0]

create_monitor:
  compute:
    instance_type: standard_e4s_v3
    runtime_version: "3.3"
  monitoring_target:
    ml_task: regression
    endpoint_deployment_id: azureml:dam-mcp-endpoint:champion

  monitoring_signals:
    data_drift:
      type: data_drift
      # Baseline = the March 2025 training features.
      reference_data:
        input_data:
          type: uri_file
          path: azureml:dam_mcp_reference:1
        data_context: training
      features:
        top_n_feature_importance: 10
      metric_thresholds:
        numerical:
          jensen_shannon_distance: 0.1
        categorical:
          jensen_shannon_distance: 0.1

    prediction_drift:
      type: prediction_drift
      reference_data:
        input_data:
          type: uri_file
          path: azureml:dam_mcp_reference:1
        data_context: training
      metric_thresholds:
        numerical:
          jensen_shannon_distance: 0.1

    data_quality:
      type: data_quality
      reference_data:
        input_data:
          type: uri_file
          path: azureml:dam_mcp_reference:1
        data_context: training
      metric_thresholds:
        numerical:
          null_value_rate: 0.05
        categorical:
          null_value_rate: 0.05

  alert_notification:
    emails:
      - mlops-alerts@example.com
