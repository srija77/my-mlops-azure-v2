# Deployment behind the endpoint, serving the champion model.
# The `model` is resolved to the champion alias at deploy time by the CD
# pipeline (az ml ... --set model=azureml:dam_mcp_forecast@champion), so this
# file never hard-codes a version.
#
# Create:  az ml online-deployment create -f aml/endpoints/deployment.yml --all-traffic
$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineDeployment.schema.json
name: champion
endpoint_name: dam-mcp-endpoint
model: azureml:dam_mcp_forecast@champion
code_configuration:
  code: ../../scoring
  scoring_script: score.py
environment:
  name: dam-mcp-scoring-env
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04:latest
  conda_file: ../../scoring/conda.yml
instance_type: Standard_DS2_v2
instance_count: 1
request_settings:
  request_timeout_ms: 30000
  max_concurrent_requests_per_instance: 4
liveness_probe:
  initial_delay: 30
  period: 15
readiness_probe:
  initial_delay: 30
  period: 15
