name: energy-train-env
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip=24.0
  - setuptools<81   # provides pkg_resources, required by mlflow at import
  - pip:
      - mlflow==2.15.1
      - azureml-mlflow==1.59.0
      - azure-ai-ml==1.23.0
      - azure-identity==1.19.0
      - scikit-learn==1.5.2
      - xgboost==2.1.3
      - statsmodels==0.14.4
      - pandas==2.2.3
      - numpy==1.26.4
      - pyarrow==15.0.2
      - matplotlib==3.9.2
      - PyYAML==6.0.2
